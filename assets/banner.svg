<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">LLM Tool Search Benchmark</title>
  <desc id="d">Eager tool loading sends every tool schema to the model; deferred loading sends a search tool and loads only what is needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <text x="60" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">LLM Tool Search</text>
  <text x="60" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Benchmark</text>
  <text x="60" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Eager vs. deferred tool loading: accuracy, tokens, latency, cost.</text>
  <text x="60" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">OpenAI  ·  OpenRouter  ·  by Umut Şahin</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">
    <text x="720" y="70" fill="#94a3b8" font-size="14" letter-spacing="1">EAGER</text>
    <rect x="720" y="84" width="420" height="52" rx="8" fill="#334155"/>
    <text x="736" y="106" fill="#60a5fa">Model request</text>
    <text x="736" y="126" fill="#cbd5e1">all 80 tool schemas  ≈ 50k tokens</text>

    <text x="720" y="188" fill="#94a3b8" font-size="14" letter-spacing="1">DEFERRED</text>
    <rect x="720" y="202" width="420" height="52" rx="8" fill="#334155"/>
    <text x="736" y="224" fill="#fb923c">Model request</text>
    <text x="736" y="244" fill="#cbd5e1">tool_search + loads only what it needs  ≈ 4k tokens</text>
  </g>
</svg>
